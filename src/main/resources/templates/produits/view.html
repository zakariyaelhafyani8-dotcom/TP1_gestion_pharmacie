<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Produit - ' + ${produit.nom}">Détail produit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/produits">Pharmacie</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/produits">Retour à la liste</a>
        </div>
    </div>
</nav>

<main class="container my-4">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h1 class="h4 mb-0" th:text="${produit.nom}">Nom du produit</h1>
        </div>
        <div class="card-body">
            <p class="text-muted" th:text="${produit.description}"></p>

            <div class="row">
                <div class="col-md-6">
                    <h2 class="h6 text-uppercase text-success">Informations</h2>
                    <dl class="row">
                        <dt class="col-sm-4">Identifiant</dt>
                        <dd class="col-sm-8" th:text="${produit.id}"></dd>
                        <dt class="col-sm-4">Prix</dt>
                        <dd class="col-sm-8" th:text="${produit.prix} + ' DH'"></dd>
                        <dt class="col-sm-4">Code-barre</dt>
                        <dd class="col-sm-8" th:text="${produit.codeBarre}"></dd>
                        <dt class="col-sm-4">Date d'expiration</dt>
                        <dd class="col-sm-8" th:text="${produit.dateExpiration}"></dd>
                        <dt class="col-sm-4">Catégorie</dt>
                        <dd class="col-sm-8" th:text="${produit.categorie != null ? produit.categorie.nom : '-'}"></dd>
                        <dt class="col-sm-4">Fournisseur</dt>
                        <dd class="col-sm-8" th:text="${produit.fournisseur != null ? produit.fournisseur.nom : '-'}"></dd>
                    </dl>
                </div>
                <div class="col-md-6">
                    <h2 class="h6 text-uppercase text-success">Détail du produit</h2>
                    <dl class="row" th:if="${produit.detailProduit != null}">
                        <dt class="col-sm-4">Fabricant</dt>
                        <dd class="col-sm-8" th:text="${produit.detailProduit.fabricant}"></dd>
                        <dt class="col-sm-4">Pays d'origine</dt>
                        <dd class="col-sm-8" th:text="${produit.detailProduit.paysOrigine}"></dd>
                        <dt class="col-sm-4">Composition</dt>
                        <dd class="col-sm-8" th:text="${produit.detailProduit.composition}"></dd>
                        <dt class="col-sm-4">Dosage</dt>
                        <dd class="col-sm-8" th:text="${produit.detailProduit.dosage}"></dd>
                        <dt class="col-sm-4">Indications</dt>
                        <dd class="col-sm-8" th:text="${produit.detailProduit.indications}"></dd>
                    </dl>
                    <p class="text-muted" th:if="${produit.detailProduit == null}">
                        Aucun détail enregistré pour ce produit.
                    </p>
                </div>
            </div>

            <h2 class="h6 text-uppercase text-success mt-4">Tags</h2>
            <div>
                <span class="badge bg-primary me-1"
                      th:each="tag : ${produit.tags}"
                      th:text="${tag.libelle}"></span>
                <span class="text-muted" th:if="${#lists.isEmpty(produit.tags)}">Aucun tag</span>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
