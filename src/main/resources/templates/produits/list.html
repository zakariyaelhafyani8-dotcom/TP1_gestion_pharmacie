<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestion de pharmacie - Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/produits">Pharmacie</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/api/produits" target="_blank">API Produits</a>
            <a class="nav-link" href="/api/categories" target="_blank">API Catégories</a>
            <a class="nav-link" href="/api/fournisseurs" target="_blank">API Fournisseurs</a>
            <a class="nav-link" href="/api/tags" target="_blank">API Tags</a>
        </div>
    </div>
</nav>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Liste des produits</h1>
        <span class="badge bg-secondary" th:text="${produits.size()} + ' produit(s)'"></span>
    </div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(produits)}">
        Aucun produit enregistré pour le moment.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(produits)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-success">
            <tr>
                <th>#</th>
                <th>Nom</th>
                <th>Description</th>
                <th>Prix</th>
                <th>Code-barre</th>
                <th>Expiration</th>
                <th>Catégorie</th>
                <th>Fournisseur</th>
                <th>Tags</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="produit : ${produits}">
                <td th:text="${produit.id}"></td>
                <td th:text="${produit.nom}"></td>
                <td th:text="${produit.description}"></td>
                <td th:text="${produit.prix} + ' DH'"></td>
                <td th:text="${produit.codeBarre}"></td>
                <td th:text="${produit.dateExpiration}"></td>
                <td th:text="${produit.categorie != null ? produit.categorie.nom : '-'}"></td>
                <td th:text="${produit.fournisseur != null ? produit.fournisseur.nom : '-'}"></td>
                <td>
                    <span class="badge bg-primary me-1"
                          th:each="tag : ${produit.tags}"
                          th:text="${tag.libelle}"></span>
                </td>
                <td>
                    <a class="btn btn-sm btn-outline-success"
                       th:href="@{/produits/{id}(id=${produit.id})}">Détail</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
